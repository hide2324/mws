<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>検閲官の机</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE6D3;
    --paper-dark:#DBD0B4;
    --paper-edge:#C8BB99;
    --ink:#221D17;
    --ink-soft:#4A4136;
    --stamp-red:#9A2B25;
    --stamp-green:#2F5D3A;
    --gold:#A9822E;
    --line:#B9AD8C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, #5b5346 0%, #3c362c 45%, #2a251d 100%);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New", sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .desk{
    width:100%;
    max-width:640px;
  }
  .headline{
    font-family:"Shippori Mincho", serif;
    color:#EDE6D3;
  }
  /* ---------- shared paper card ---------- */
  .paper{
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px),
      var(--paper);
    border:1px solid var(--paper-edge);
    box-shadow: 0 18px 40px rgba(0,0,0,0.45), inset 0 0 60px rgba(120,100,60,0.06);
    position:relative;
  }
  .paper::before{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.35) 0%, transparent 6%),
      linear-gradient(-45deg, rgba(0,0,0,0.05) 0%, transparent 8%);
    pointer-events:none;
  }

  /* ---------- start screen ---------- */
  #screen-start .paper{
    padding:36px 32px 28px;
  }
  #screen-start h1{
    font-size:28px;
    margin:0 0 6px;
    letter-spacing:.08em;
  }
  #screen-start .sub{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 28px;
    line-height:1.7;
  }
  .file-tabs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .file-tab{
    border:1px solid var(--line);
    background:var(--paper-dark);
    padding:16px 14px;
    cursor:pointer;
    text-align:left;
    font-family:"Zen Kaku Gothic New", sans-serif;
    position:relative;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .file-tab::before{
    content:"";
    position:absolute; left:14px; top:-8px;
    width:34px; height:8px;
    background:var(--paper-dark);
    border:1px solid var(--line);
    border-bottom:none;
  }
  .file-tab:hover{ transform:translateY(-3px); box-shadow:0 8px 16px rgba(0,0,0,0.25); }
  .file-tab .lv{
    font-family:"Shippori Mincho", serif;
    font-size:17px;
    font-weight:700;
    display:block;
    margin-bottom:4px;
  }
  .file-tab .desc{
    font-size:12px;
    color:var(--ink-soft);
    display:block;
  }
  .file-tab .timer-mark{
    display:inline-block;
    margin-top:8px;
    font-size:11px;
    padding:2px 6px;
    border:1px solid var(--stamp-red);
    color:var(--stamp-red);
  }

  /* ---------- game screen ---------- */
  #screen-game{ display:none; }
  .status-bar{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    color:#EDE6D3;
    font-size:13px;
    margin-bottom:10px;
    padding:0 4px;
  }
  .status-bar .count{
    font-family:"Shippori Mincho", serif;
    font-size:15px;
  }
  #timer-wrap{
    font-variant-numeric:tabular-nums;
  }
  #timer-wrap.low{ color:var(--stamp-red); }

  .letter-card{
    padding:0;
    overflow:hidden;
  }
  .letter-head{
    background:var(--paper-dark);
    border-bottom:1px dashed var(--line);
    padding:16px 22px;
    font-size:13px;
    line-height:1.9;
  }
  .letter-head .row{ display:flex; gap:8px; }
  .letter-head .label{
    color:var(--ink-soft);
    min-width:56px;
    flex-shrink:0;
  }
  .letter-head .val{
    font-family:monospace, "Zen Kaku Gothic New";
    word-break:break-all;
  }
  .letter-head .subject{
    font-family:"Zen Kaku Gothic New";
    font-weight:700;
    font-size:15px;
    margin-top:2px;
  }
  .letter-body{
    padding:20px 22px 6px;
    font-size:14.5px;
    line-height:2;
    white-space:pre-wrap;
    min-height:140px;
  }
  .attachment{
    margin:0 22px 18px;
    padding:8px 12px;
    background:#e4dabf;
    border:1px solid var(--line);
    font-family:monospace;
    font-size:12.5px;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .attachment::before{ content:"📎"; }

  .choice-zone{
    padding:16px 22px 22px;
    border-top:1px dashed var(--line);
  }
  .choice-zone .prompt{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0 0 10px;
  }
  .choices{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .choice-btn{
    text-align:left;
    background:#fbf8f0;
    border:1px solid var(--line);
    padding:10px 12px;
    font-size:13.5px;
    cursor:pointer;
    font-family:"Zen Kaku Gothic New";
    color:var(--ink);
  }
  .choice-btn:hover{ background:#f2ecd9; }
  .choice-btn.picked{
    border-color:var(--gold);
    background:#f4ead0;
    box-shadow: inset 0 0 0 1px var(--gold);
  }

  .verdict-zone{
    display:none;
    padding:18px 22px 24px;
    border-top:1px dashed var(--line);
    gap:16px;
    justify-content:center;
  }
  .verdict-zone.show{ display:flex; }
  .stamp-btn{
    width:120px; height:120px;
    border-radius:50%;
    border:5px solid currentColor;
    background:transparent;
    font-family:"Shippori Mincho", serif;
    font-size:22px;
    font-weight:700;
    cursor:pointer;
    letter-spacing:.15em;
    transition:transform .08s ease;
    position:relative;
  }
  .stamp-btn:active{ transform:scale(0.9) rotate(-4deg); }
  .stamp-btn.pass{ color:var(--stamp-green); }
  .stamp-btn.reject{ color:var(--stamp-red); }
  .stamp-btn::after{
    content:"";
    position:absolute; inset:6px;
    border:1px solid currentColor;
    border-radius:50%;
    opacity:.5;
  }

  /* stamp mark stuck on letter after decision */
  .stamp-mark{
    position:absolute;
    font-family:"Shippori Mincho", serif;
    font-size:15px;
    font-weight:700;
    border:3px solid currentColor;
    border-radius:50%;
    padding:10px 14px;
    transform:rotate(-14deg) scale(1.4);
    opacity:0;
    top:16px; right:22px;
    pointer-events:none;
    transition:opacity .15s ease, transform .35s cubic-bezier(.2,1.4,.4,1);
  }
  .stamp-mark.show{ opacity:.85; transform:rotate(-14deg) scale(1); }
  .stamp-mark.pass{ color:var(--stamp-green); }
  .stamp-mark.reject{ color:var(--stamp-red); }

  .loading{
    padding:60px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13.5px;
  }

  /* ---------- feedback overlay ---------- */
  #screen-feedback{
    display:none;
    position:fixed; inset:0;
    background:rgba(20,17,12,0.72);
    align-items:center; justify-content:center;
    z-index:10;
    padding:20px;
  }
  #screen-feedback.show{ display:flex; }
  .fb-card{
    max-width:480px; width:100%;
    padding:30px 28px;
  }
  .fb-tag{
    display:inline-block;
    font-family:"Shippori Mincho", serif;
    font-size:22px;
    font-weight:700;
    padding:4px 14px;
    border:3px solid currentColor;
    margin-bottom:16px;
  }
  .fb-tag.correct{ color:var(--stamp-green); }
  .fb-tag.bad{ color:var(--stamp-red); }
  .fb-reason{ font-size:14px; line-height:1.9; margin:0 0 20px; }
  .fb-reason b{ display:block; font-size:12px; color:var(--ink-soft); font-weight:500; margin-bottom:4px; }
  .next-btn{
    display:block;
    width:100%;
    padding:12px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    font-family:"Zen Kaku Gothic New";
    font-size:14px;
    letter-spacing:.05em;
    cursor:pointer;
  }
  .next-btn:hover{ background:#3a3226; }

  /* ---------- result screen ---------- */
  #screen-result{ display:none; }
  #screen-result .paper{ padding:34px 30px; }
  #screen-result h2{
    font-family:"Shippori Mincho", serif;
    font-size:22px;
    margin:0 0 4px;
  }
  #screen-result .rank{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0 0 22px;
  }
  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    margin-bottom:24px;
  }
  .stat-cell{
    background:var(--paper);
    padding:14px 16px;
  }
  .stat-cell .n{
    font-family:"Shippori Mincho", serif;
    font-size:24px;
    display:block;
  }
  .stat-cell .l{
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .stat-cell.wide{ grid-column:span 2; background:#e4dabf; }
  .retry-btn{
    width:100%;
    padding:13px;
    background:transparent;
    border:1px solid var(--ink);
    font-family:"Zen Kaku Gothic New";
    font-size:14px;
    cursor:pointer;
    color:var(--ink);
  }
  .retry-btn:hover{ background:var(--paper-dark); }

  .api-note{
    font-size:10.5px;
    color:#c8bfa5;
    text-align:center;
    margin-top:14px;
    line-height:1.6;
  }
</style>
</head>
<body>

<div class="desk">

  <!-- START -->
  <div id="screen-start">
    <h1 class="headline">検閲官の机</h1>
    <p class="headline sub" style="color:#cfc6ac; font-family:'Zen Kaku Gothic New';">
      国境検閲局へようこそ。届く手紙を審査し、通過させるか却下するかを判断せよ。
      誤った判断は記録に残る。
    </p>
    <div class="paper" style="padding:22px;">
      <p class="sub" style="margin-bottom:16px;">案件の難易度を選択してください</p>
      <div class="file-tabs">
        <button class="file-tab" data-level="easy" data-timed="0">
          <span class="lv">イージー</span>
          <span class="desc">分かりやすい不審点が中心。制限時間なし。</span>
        </button>
        <button class="file-tab" data-level="easy" data-timed="1">
          <span class="lv">イージー</span>
          <span class="desc">分かりやすい不審点が中心。</span>
          <span class="timer-mark">制限時間 15秒</span>
        </button>
        <button class="file-tab" data-level="hard" data-timed="0">
          <span class="lv">ハード</span>
          <span class="desc">巧妙で見抜きにくい案件。制限時間なし。</span>
        </button>
        <button class="file-tab" data-level="hard" data-timed="1">
          <span class="lv">ハード</span>
          <span class="desc">巧妙で見抜きにくい案件。</span>
          <span class="timer-mark">制限時間 8秒</span>
        </button>
      </div>
    </div>
    <p class="api-note">Gemini API で案件を生成します。生成に失敗した場合は予備の案件で続行します。</p>
  </div>

  <!-- GAME -->
  <div id="screen-game">
    <div class="status-bar">
      <span class="count">検閲 <span id="cur-num">1</span> / <span id="total-num">8</span></span>
      <span id="src-wrap" style="font-size:11px; opacity:.7;"></span>
      <span id="timer-wrap">残り時間 --</span>
    </div>
    <div class="paper letter-card" id="letter-card">
      <div id="letter-content"></div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="screen-result">
    <div class="paper">
      <h2>本日の検閲結果</h2>
      <p class="rank" id="rank-line">――</p>
      <div class="stat-grid" id="stat-grid"></div>
      <button class="retry-btn" id="retry-btn">別の案件に取り組む</button>
    </div>
  </div>

</div>

<!-- FEEDBACK OVERLAY -->
<div id="screen-feedback">
  <div class="paper fb-card">
    <span class="fb-tag" id="fb-tag">摘発</span>
    <div class="fb-reason">
      <b>正しい判断の根拠</b>
      <span id="fb-explain">――</span>
    </div>
    <button class="next-btn" id="next-btn">次の手紙へ</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  const API_KEY = "a
  const MODEL = "gemini-3.6-flash";
  const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;

  const TOTAL_LETTERS = 8;

  const state = {
    level: "easy",
    timed: false,
    timeLimit: 0,
    round: 0,
    letters: [],
    stats: { total:0, rejected:0, falseReject:0, missed:0, caught:0 },
    current: null,
    recentSubjects: [],
    pickedChoiceId: null,
    timerId: null,
    timeLeft: 0,
    locked: false
  };

  const el = (id) => document.getElementById(id);

  // ---------------- fallback letters (used if API fails) ----------------
  const FALLBACK = {
    easy: [
      {
        sender_name: "内閣国民生活支援課",
        sender_email: "support@gov-life-jp.net",
        subject: "【緊急】給付金受給資格の確認について",
        body: "この度、あなたは特別給付金の対象者に選ばれました。\n本日18時までに下記より個人情報（氏名・生年月日・口座番号・暗証番号）をご登録ください。\n期限を過ぎると受給資格を失いますのでご注意ください。\nhttp://gov-life-jp.net/entry",
        attachment: null,
        is_phishing: true,
        choices: [
          {id:"a", label:"送信元ドメインが公的機関のものではない（.net）"},
          {id:"b", label:"本文の言葉遣いが丁寧すぎる"},
          {id:"c", label:"件名に【緊急】と書かれている"},
          {id:"d", label:"特に問題は見当たらない"}
        ],
        correct_choice_id:"a",
        correct_action:"reject",
        explanation:"公的機関を名乗りながらドメインが「.net」の民間アドレスであり、暗証番号という本来聞かれるはずのない情報を、時間制限で急がせて要求しています。典型的なフィッシングの手口です。"
      },
      {
        sender_name: "市役所 住民課",
        sender_email: "jyuumin@city-sample.lg.jp",
        subject: "住民票発行手数料改定のお知らせ",
        body: "平素より市政にご協力いただきありがとうございます。\n来月1日より住民票発行手数料が300円から350円に改定されます。\nご不明な点は窓口までお問い合わせください。",
        attachment: null,
        is_phishing: false,
        choices: [
          {id:"a", label:"送信元ドメインが不自然"},
          {id:"b", label:"個人情報を要求している"},
          {id:"c", label:"不自然に急かしている"},
          {id:"d", label:"特に問題は見当たらない"}
        ],
        correct_choice_id:"d",
        correct_action:"pass",
        explanation:"公式ドメイン（.lg.jp）からの通知で、個人情報の要求や不自然な緊急性もない、通常の行政連絡です。"
      }
    ],
    hard: [
      {
        sender_name: "外国人在留支援センター",
        sender_email: "info@zairyu-support-center.jp",
        subject: "在留カード情報更新のご案内",
        body: "在留カードの記載事項に変更があった方は、下記フォームより氏名・生年月日・住所・職業・電話番号・家族構成をご登録ください。\n手続きは平文のメール返信で構いません。本日18時までにご対応いただけますと幸いです。\nご協力よろしくお願いいたします。",
        attachment: "申請書.pdf.exe",
        is_phishing: true,
        choices: [
          {id:"a", label:"ドメインが本物の行政機関か確認できない上、正規の手続き（窓口・郵送）を避け暗号化せず平文で家族構成まで求めている"},
          {id:"b", label:"文章が丁寧である"},
          {id:"c", label:"件名が事務的すぎる"},
          {id:"d", label:"特に問題は見当たらない"}
        ],
        correct_choice_id:"a",
        correct_action:"reject",
        explanation:"添付ファイルの拡張子が「.pdf.exe」という偽装ファイルであり、本来窓口や書面で行うべき手続きを平文メールで済ませようとし、家族構成まで聞き出そうとしています。要求内容と目的が釣り合っていません。"
      },
      {
        sender_name: "取引先 経理部 田中",
        sender_email: "tanaka@partner-corp.co.jp",
        subject: "Re: 請求書送付の件（訂正版）",
        body: "先ほどの請求書に金額の誤りがございました。訂正版を添付いたします。\nお手数ですが、旧版は破棄いただき、こちらのファイルでお手続きください。\nよろしくお願いいたします。",
        attachment: "invoice_corrected.pdf",
        is_phishing: false,
        choices: [
          {id:"a", label:"添付ファイルの拡張子が偽装されている"},
          {id:"b", label:"送信元ドメインが取引先と一致せず不自然"},
          {id:"c", label:"個人の認証情報を要求している"},
          {id:"d", label:"特に問題は見当たらない"}
        ],
        correct_choice_id:"d",
        correct_action:"pass",
        explanation:"取引先の正規ドメインからの返信で、添付は通常のPDF、認証情報や個人情報の要求もありません。業務上ごく自然なやり取りです。"
      }
    ]
  };

  let fallbackIdx = { easy:0, hard:0 };

  // ---------------- Gemini call ----------------
  async function generateLetter(level){
    const difficultyNote = level === "easy"
      ? "初心者向け。危険な要素（不審なドメイン、個人情報や認証情報の要求、緊急性を煽る表現など）を比較的分かりやすく含める。ただし約4割は正常な手紙にする。"
      : "上級者向け。一見自然に見えるが、よく読むと不自然な点（ドメインの微妙な違い、正規手続きを避けている、要求内容と目的の不釣り合いなど）が隠れている、見抜きにくい案件にする。ただし約4割は正常な手紙にする。";

    const avoidNote = state.recentSubjects.length
      ? `\n- 直近に出題した以下の件名・題材とは、業種・シチュエーション・差出人の種類を必ず変えること（重複禁止）: ${state.recentSubjects.join(" / ")}`
      : "";

    const seed = Math.random().toString(36).slice(2, 8);

    const prompt = `あなたは日本語のフィッシングメール判定教育ゲームの問題作成者です。(seed:${seed})
以下の条件で、1通の「手紙（メール）」の案件をJSON形式のみで出力してください。前置きや説明、コードブロックの記号は一切不要です。

条件:
- ${difficultyNote}
- 差出人名、差出人メールアドレス、件名、本文（改行を含む自然な日本語の文章、150〜300文字程度）を作成する。
- 添付ファイル名がある場合は attachment に文字列で、ない場合は null を入れる。
- 選択肢 choices は4つ作成する。フィッシングの場合は「不審だと思う点」の説明を3つ、正常な手紙の場合はダミーの不審点3つ、そして必ず1つは「特に問題は見当たらない」という選択肢を含める。
- correct_choice_id は正しい選択肢のid（フィッシングなら不審点、正常なら「特に問題は見当たらない」）。
- correct_action は "reject"（却下すべき＝フィッシング）または "pass"（通過させるべき＝正常）。
- explanation は正しい判断の根拠を100〜160文字程度の日本語で説明する。
- 差出人の業種・組織（役所/銀行/宅配/通販/勤務先/学校/SNS/税務など）や状況は毎回ランダムに変えること。${avoidNote}

出力するJSONのスキーマ:
{
  "sender_name": string,
  "sender_email": string,
  "subject": string,
  "body": string,
  "attachment": string または null,
  "is_phishing": boolean,
  "choices": [{"id": string, "label": string}, ... 4件],
  "correct_choice_id": string,
  "correct_action": "reject" または "pass",
  "explanation": string
}`;

    const resp = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-goog-api-key": API_KEY
      },
      body: JSON.stringify({
        contents: [{ role:"user", parts:[{ text: prompt }] }],
        generationConfig: { temperature: 0.9, responseMimeType: "application/json" }
      })
    });

    if(!resp.ok){
      const errBody = await resp.text().catch(()=> "");
      throw new Error(`API request failed: ${resp.status} ${errBody}`);
    }
    const data = await resp.json();
    const text = data?.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("") || "";
    const cleaned = text.replace(/```json|```/g, "").trim();
    if(!cleaned) throw new Error("empty response from API: " + JSON.stringify(data));
    const letter = JSON.parse(cleaned);
    if(!letter.sender_email || !letter.body || !letter.choices) throw new Error("invalid letter shape: " + cleaned);
    return letter;
  }

  function getFallback(level){
    const list = FALLBACK[level];
    const item = list[fallbackIdx[level] % list.length];
    fallbackIdx[level]++;
    return JSON.parse(JSON.stringify(item));
  }

  // ---------------- flow ----------------
  document.querySelectorAll(".file-tab").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.level = btn.dataset.level;
      state.timed = btn.dataset.timed === "1";
      state.timeLimit = state.level === "easy" ? 15 : 8;
      startGame();
    });
  });

  el("retry-btn").addEventListener("click", ()=>{
    el("screen-result").style.display = "none";
    el("screen-start").style.display = "block";
  });

  el("next-btn").addEventListener("click", ()=>{
    el("screen-feedback").classList.remove("show");
    if(state.round >= TOTAL_LETTERS){
      showResult();
    } else {
      loadLetter();
    }
  });

  function startGame(){
    state.round = 0;
    state.stats = { total:0, rejected:0, falseReject:0, missed:0, caught:0 };
    el("total-num").textContent = TOTAL_LETTERS;
    el("screen-start").style.display = "none";
    el("screen-result").style.display = "none";
    el("screen-game").style.display = "block";
    loadLetter();
  }

  async function loadLetter(){
    state.round++;
    state.pickedChoiceId = null;
    state.locked = false;
    el("cur-num").textContent = state.round;
    clearInterval(state.timerId);
    el("timer-wrap").textContent = "残り時間 --";
    el("timer-wrap").classList.remove("low");

    el("letter-content").innerHTML = `<div class="loading">案件を作成しています…</div>`;

    let letter;
    try{
      letter = await generateLetter(state.level);
      letter._source = "api";
      state.recentSubjects.push(letter.subject);
      if(state.recentSubjects.length > 5) state.recentSubjects.shift();
    }catch(e){
      console.error("[検閲官の机] API生成に失敗、予備案件を使用します:", e);
      letter = getFallback(state.level);
      letter._source = "fallback";
    }
    state.current = letter;
    el("src-wrap").textContent = letter._source === "api" ? "(API生成)" : "(予備案件)";
    renderLetter(letter);
    if(state.timed) startTimer();
  }

  function renderLetter(letter){
    const attachHtml = letter.attachment
      ? `<div class="attachment">${escapeHtml(letter.attachment)}</div>`
      : "";
    const choicesHtml = letter.choices.map(c=>
      `<button class="choice-btn" data-id="${c.id}">${escapeHtml(c.label)}</button>`
    ).join("");

    el("letter-content").innerHTML = `
      <div class="letter-head">
        <div class="row"><span class="label">差出人</span><span class="val">${escapeHtml(letter.sender_name)}</span></div>
        <div class="row"><span class="label">アドレス</span><span class="val">${escapeHtml(letter.sender_email)}</span></div>
        <div class="subject">${escapeHtml(letter.subject)}</div>
      </div>
      <div class="letter-body">${escapeHtml(letter.body)}</div>
      ${attachHtml ? `<div style="padding:0 22px 12px;">${attachHtml}</div>` : ""}
      <div class="choice-zone">
        <p class="prompt">この手紙について、あなたが感じた点を一つ選んでください。</p>
        <div class="choices" id="choices-list">${choicesHtml}</div>
      </div>
      <div class="verdict-zone" id="verdict-zone">
        <button class="stamp-btn pass" id="btn-pass">通　過</button>
        <button class="stamp-btn reject" id="btn-reject">却　下</button>
      </div>
      <div class="stamp-mark" id="stamp-mark"></div>
    `;

    document.querySelectorAll("#choices-list .choice-btn").forEach(b=>{
      b.addEventListener("click", ()=>{
        if(state.locked) return;
        document.querySelectorAll("#choices-list .choice-btn").forEach(x=>x.classList.remove("picked"));
        b.classList.add("picked");
        state.pickedChoiceId = b.dataset.id;
        el("verdict-zone").classList.add("show");
      });
    });
    el("btn-pass").addEventListener("click", ()=> judge("pass"));
    el("btn-reject").addEventListener("click", ()=> judge("reject"));
  }

  function startTimer(){
    state.timeLeft = state.timeLimit;
    updateTimerLabel();
    state.timerId = setInterval(()=>{
      state.timeLeft--;
      updateTimerLabel();
      if(state.timeLeft <= 0){
        clearInterval(state.timerId);
        if(!state.locked) judge("pass", true); // 時間切れは自動的に通過扱い
      }
    }, 1000);
  }
  function updateTimerLabel(){
    el("timer-wrap").textContent = `残り時間 ${state.timeLeft}秒`;
    el("timer-wrap").classList.toggle("low", state.timeLeft <= 5);
  }

  function judge(action, isTimeout){
    if(state.locked) return;
    state.locked = true;
    clearInterval(state.timerId);

    const letter = state.current;
    const correctAction = letter.correct_action; // "pass" | "reject"
    state.stats.total++;
    if(action === "reject") state.stats.rejected++;

    let outcome, tag, tagClass;
    if(correctAction === "reject" && action === "reject"){
      outcome = "correct"; state.stats.caught++;
      tag = "摘発"; tagClass = "correct";
    } else if(correctAction === "reject" && action === "pass"){
      outcome = "bad"; state.stats.missed++;
      tag = "見逃し"; tagClass = "bad";
    } else if(correctAction === "pass" && action === "reject"){
      outcome = "bad"; state.stats.falseReject++;
      tag = "誤却下"; tagClass = "bad";
    } else {
      outcome = "correct";
      tag = "適正通過"; tagClass = "correct";
    }

    // stamp mark animation on the letter itself
    const mark = el("stamp-mark");
    if(mark){
      mark.textContent = action === "reject" ? "却下" : "通過";
      mark.classList.remove("pass","reject");
      mark.classList.add(action === "reject" ? "reject" : "pass", "show");
    }

    setTimeout(()=>{
      let explain = letter.explanation;
      if(isTimeout){
        explain = "審査時間が終了したため、自動的に通過となりました。" + explain;
      }
      el("fb-tag").textContent = tag;
      el("fb-tag").className = "fb-tag " + tagClass;
      el("fb-explain").textContent = explain;
      el("screen-feedback").classList.add("show");
    }, 420);
  }

  function showResult(){
    el("screen-game").style.display = "none";
    el("screen-result").style.display = "block";
    const s = state.stats;
    const accuracy = s.total ? Math.round(((s.caught + (s.total - s.rejected - s.missed)) / s.total) * 100) : 0;
    let rank = "見習い検閲官";
    if(accuracy >= 90) rank = "特級検閲官";
    else if(accuracy >= 70) rank = "上級検閲官";
    else if(accuracy >= 50) rank = "中級検閲官";

    el("rank-line").textContent = `正答率 ${accuracy}% ／ 認定：${rank}`;
    el("stat-grid").innerHTML = `
      <div class="stat-cell"><span class="n">${s.total}</span><span class="l">検閲総数</span></div>
      <div class="stat-cell"><span class="n">${s.rejected}</span><span class="l">却下総数</span></div>
      <div class="stat-cell"><span class="n">${s.falseReject}</span><span class="l">誤却下数</span></div>
      <div class="stat-cell"><span class="n">${s.missed}</span><span class="l">見逃し数</span></div>
      <div class="stat-cell wide"><span class="n">${s.caught}</span><span class="l">摘発数（正しく危険な手紙を却下）</span></div>
    `;
  }

  function escapeHtml(str){
    return String(str)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/\n/g,"<br>");
  }

})();
</script>
</body>
</html>
